[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-drata"
version = "0.1.0"
description = "Read-only OCI configuration-evidence collector that upserts one aggregate record into a Drata Custom Connection."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "oci>=2.150,<3",
    "PyYAML>=6.0,<7",
    "jsonschema>=4.20,<5",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "responses>=0.25,<1",
    "mypy>=1.10,<2",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
oci-drata = "oci_drata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# The official OCI SDK ships no py.typed marker / stub package.
module = "oci.*"
ignore_missing_imports = true
