deployment:
  name: example-production
  snapshotDisplayName: Example production OCI snapshot

oci:
  authentication:
    type: api_signing_user
    configFile: ~/.oci/config
    profile: DEFAULT
    privateKeyPassphraseSecretRef: null
  expectedTenancyOcid: ocid1.tenancy.oc1..replace-me
  regions:
    allow:
      - us-ashburn-1
      - us-phoenix-1
  compartments:
    roots:
      - tenancy
    excludeOcids: []
  services:
    compute: true
    networkExposure: true
    blockStorage: true
    baseDatabase: true
    autonomousDatabase: true
    exadataDetection: true
    siteToSiteVpn: true
    # Optional, defaults to false if omitted. Broader trust footprint than the other
    # domains above -- reads user MFA status, API key ages, and raw IAM policy
    # statement text (never credentials/secrets). See README Section 4 for the
    # additional least-privilege policy grant this needs before enabling it.
    identity: false
    # Optional, defaults to false if omitted. Reads bucket-level metadata only
    # (public access setting, encryption key, versioning) -- never object contents.
    objectStorage: false
    # Optional, defaults to false if omitted. Reads the tenancy's Cloud Guard
    # configuration status only (enabled/disabled) -- no findings/detector detail.
    cloudGuard: false
    # Optional, defaults to false if omitted. Reads alarm definitions (whether an
    # alarm exists and is enabled for a given metric query) -- never metric data
    # itself or alarm history.
    monitoring: false

decisions:
  administrativePorts: [22, 3389]
  publicSourceCidrs:
    - 0.0.0.0/0
    - ::/0
  minimumVpnTunnelCount: 2
  minimumUpVpnTunnelCount: 1
  freshnessHours: 26
  requireCustomerManagedVolumeKeys: false
  requireCustomerManagedDatabaseKeys: false

drata:
  # baseUrl hostname must be public-api.drata.com unless allowAlternateHost: true is set
  # explicitly (e.g. a regional/dedicated Drata instance) -- see README §7.
  baseUrl: https://public-api.drata.com/public/v2
  # connectionId/resourceId must both be replaced with real positive IDs from the
  # customer's own Drata Custom Connection -- 0 is a deliberate placeholder that fails
  # config load immediately if left unedited, rather than only failing at upload time.
  connectionId: 0
  resourceId: 0
  recordId: oci-snapshot-replace-with-derived-id
  apiTokenSecretRef:
    provider: env
    name: DRATA_API_TOKEN
  # Optional. Resource ID of a SECOND Custom Connection resource registered with
  # schemas/flat-record.schema.json (see PLAN.md) -- create it via a direct API
  # call, not the web UI ([internal-ticket]/[internal-ticket]). Leave null/unset to skip the
  # flat-record publish path entirely; resourceId above is unaffected either way.
  flatResourceId: null

runtime:
  maxPayloadBytes: 4500000
  maxConcurrency: 8
  logLevel: INFO
  dryRun: true
